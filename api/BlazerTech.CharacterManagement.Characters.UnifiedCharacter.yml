  namespace: BlazerTech.CharacterManagement.Characters
  summary: Represents a character built from a single, unified spritesheet containg all animations of the character.
  remarks: >-
    A <xref href="BlazerTech.CharacterManagement.Characters.UnifiedCharacter" data-throw-if-not-resolved="false"></xref> is tied to a <xref href="BlazerTech.CharacterManagement.Characters.UnifiedCharacterTypeSO" data-throw-if-not-resolved="false"></xref> 

    that defines the base spritesheet and animator controller used.


    Instances are typically created from a <xref href="BlazerTech.CharacterManagement.Characters.UnifiedCharacterTemplateSO" data-throw-if-not-resolved="false"></xref>,

    which provides the character’s name, type, and spritesheet reference.
  example: []
  syntax:
    content: 'public class UnifiedCharacter : CharacterBase<UnifiedCharacterTypeSO, UnifiedCharacter.UnifiedCharacterShaderState>, ICharacter<UnifiedCharacterTypeSO, UnifiedCharacter.UnifiedCharacterShaderState>, IValidatable'
    content.vb: Public Class UnifiedCharacter Inherits CharacterBase(Of UnifiedCharacterTypeSO, UnifiedCharacter.UnifiedCharacterShaderState) Implements ICharacter(Of UnifiedCharacterTypeSO, UnifiedCharacter.UnifiedCharacterShaderState), IValidatable
