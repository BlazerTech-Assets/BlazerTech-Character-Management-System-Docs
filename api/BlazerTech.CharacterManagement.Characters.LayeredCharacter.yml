    path: ../../../Unity/Unity Projects/BlazerTech Character Management System/Assets/BT-CMS/Scripts/Core/Characters/Layered Characters/LayeredCharacter.cs
    startLine: 276
  assemblies:
  - Assembly-CSharp
  namespace: BlazerTech.CharacterManagement.Characters
  summary: >-
    Determines whether the current <xref href="BlazerTech.CharacterManagement.Characters.LayeredCharacter" data-throw-if-not-resolved="false"></xref> instance is valid,

    extending the base <xref href="BlazerTech.CharacterManagement.Characters.CharacterBase%602.IsValid" data-throw-if-not-resolved="false"></xref> checks with additional

    requirements specific to layered characters.
  remarks: >-
    Validation steps:

    <ol><li>Calls the base <xref href="BlazerTech.CharacterManagement.Characters.CharacterBase%602.IsValid" data-throw-if-not-resolved="false"></xref> method to validate
        the <xref href="BlazerTech.CharacterManagement.Characters.CharacterBase%602.CharacterName" data-throw-if-not-resolved="false"></xref> and <xref href="BlazerTech.CharacterManagement.Characters.CharacterBase%602.CharacterType" data-throw-if-not-resolved="false"></xref>.</li><li>Verifies that the <xref href="BlazerTech.CharacterManagement.Core.CMSInitializationHandler" data-throw-if-not-resolved="false"></xref> has completed initialization first.</li><li>Checks that <xref href="BlazerTech.CharacterManagement.Characters.LayeredCharacter.Layers" data-throw-if-not-resolved="false"></xref> matches the same layer count in
        <xref href="BlazerTech.CharacterManagement.Characters.CharacterBase%602.CharacterType" data-throw-if-not-resolved="false"></xref>.</li></ol>
  example: []
  syntax:
    content: public override bool PerformValidationCheck()
